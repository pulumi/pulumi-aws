    needs: prerequisites
    uses: pulumi/ci-mgmt/.github/workflows/compare_sdk.yml@master
    permissions:
      contents: read
    with:
      version: ${{ needs.prerequisites.outputs.version }}
      languages: '["nodejs","python","dotnet","go","java"]'
      runs-on: ubuntu-latest
      mise-version: 2026.10.21
      checkout-submodules: 'true'

  post_build:
    name: post_build
    needs: prerequisites
    uses: ./.github/workflows/main-post-build.yml
    secrets: inherit
    permissions:
      contents: write # For Renovate SDKs.
      id-token: write # For ESC secrets.
    with:
      version: ${{ needs.prerequisites.outputs.version }}

  license_check:
    if: github.repository == 'pulumi/pulumi-aws'
    name: License Check
    uses: ./.github/workflows/license.yml
    secrets: inherit

  publish:
    name: publish
    permissions:
      contents: write
      id-token: write
    needs:
      - prerequisites
      - build_provider
      - test
      - license_check
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      version: ${{ needs.prerequisites.outputs.version }}
      isPrerelease: true
      setLatestRelease: false
      skipGoSdk: true
      skipJavaSdk: true

  tag_release_if_labeled_needs_release:
    name: Tag release if labeled as needs-release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # For ESC secrets.
    steps:
    - name: Checkout Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false    
    - id: esc-auth
      name: Authenticate with Pulumi Cloud
      uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2
      with:
        export-environment-variables: "false"
        organization: pulumi
        requested-token-type: urn:pulumi:token-type:access_token:organization
    - id: esc-secrets
      name: Fetch secrets from ESC
