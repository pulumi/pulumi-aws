# WARNING: This file is autogenerated - changes will be overwritten when regenerated by https://github.com/pulumi/ci-mgmt

name: "Main post-build"

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

env:
  AWS_REGION: us-west-2
  PULUMI_API: https://api.pulumi-staging.io
  PULUMI_GO_DEP_ROOT: ${{ github.workspace }}/..
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  PULUMI_MISSING_DOCS_ERROR: "true"
  PULUMI_PULUMI_ENABLE_JOURNALING: "true"
  TF_APPEND_USER_AGENT: pulumi

jobs:
  generate_coverage_data:
    continue-on-error: true
    name: generate_coverage_data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # For ESC secrets.
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          swap-storage: false
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false      
      - id: esc-auth
        name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2
        with:
          export-environment-variables: "false"
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
      - id: esc-secrets
        name: Fetch secrets from ESC
        uses: pulumi/esc-action@ce885ce2ea6bf59194b7b0a3e94a4d3f7bacece0
        with:
          environment: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          export-environment-variables: "false"
          pulumi-access-token: ${{ steps.esc-auth.outputs.pulumi-access-token }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-auth
        with:
          app-id: ${{ steps.esc-secrets.outputs.PULUMI_PROVIDER_AUTOMATION_APP_ID }}
          private-key: ${{ steps.esc-secrets.outputs.PULUMI_PROVIDER_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ steps.esc-secrets.outputs.AWS_CORP_S3_UPLOAD_ACCESS_KEY_ID }}
          aws-region: us-west-2
          aws-secret-access-key: ${{ steps.esc-secrets.outputs.AWS_CORP_S3_UPLOAD_SECRET_ACCESS_KEY }}
      - name: Setup mise
        uses: jdx/mise-action@8d3b0ba20a9cea7b883d922ea958553c941ab082
        env:
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
        with:
          version: 2026.10.21
          github_token: ${{ steps.app-auth.outputs.token }}
          # only saving the cache in the prerequisites job
          cache_save: false
      - name: Install project dependencies
        run: mise deps install
      - name: Setup Go Cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          cache-dependency-path: |
            provider/*.sum
            upstream/*.sum
            sdk/go/*.sum
            sdk/*.sum
            *.sum
      - name: Echo Coverage Output Dir
        run: 'echo "Coverage output directory: ${{ env.COVERAGE_OUTPUT_DIR }}"'
      - name: Generate Coverage Data
        run: PULUMI_MISSING_DOCS_ERROR=true make tfgen
        env:
          COVERAGE_OUTPUT_DIR: ${{ runner.temp }}/cov
      - name: Summarize Provider Coverage Results
        run: cat ${{ env.COVERAGE_OUTPUT_DIR }}/shortSummary.txt
        env:
          COVERAGE_OUTPUT_DIR: ${{ runner.temp }}/cov
      - name: Upload coverage data to S3
        run: >-
          summaryName="${PROVIDER}_summary_$(date +"%Y-%m-%d_%H-%M-%S").json"

          s3FullURI="s3://${{ steps.esc-secrets.outputs.S3_COVERAGE_BUCKET_NAME }}/summaries/${summaryName}"

          aws s3 cp "${{ env.COVERAGE_OUTPUT_DIR }}/summary.json" "${s3FullURI}" --acl bucket-owner-full-control
        env:
          COVERAGE_OUTPUT_DIR: ${{ runner.temp }}/cov
